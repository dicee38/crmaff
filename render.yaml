databases:
  - name: crm-postgres
    databaseName: crm
    user: crm
    plan: free
    postgresMajorVersion: "15"

services:
  - type: redis
    name: crm-redis
    plan: free
    ipAllowList: []

  - type: web
    name: crm-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: crm-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: BINOLLA_WEBHOOK_SECRET
        generateValue: true
      - key: CHATTERFY_WEBHOOK_SECRET
        generateValue: true
      - key: TRACK_CLICK_SIGNING_SECRET
        generateValue: true
      - key: RATE_LIMIT_PUBLIC_PER_MINUTE
        value: "60"
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
      - key: SENTRY_DSN
        value: ""
